services:
  etcd:
    image: m.daocloud.io/quay.io/coreos/etcd:v3.5.25
    container_name: openkb-milvus-etcd-test
    command:
      - etcd
      - --data-dir=/etcd
      - --advertise-client-urls=http://127.0.0.1:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://127.0.0.1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=default=http://127.0.0.1:2380
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=4294967296
    volumes:
      - openkb-milvus-etcd-test-data:/etcd

  minio:
    image: m.daocloud.io/docker.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: openkb-milvus-minio-test
    command: server /data
    environment:
      MINIO_ROOT_USER: openkb
      MINIO_ROOT_PASSWORD: openkb-secret
    volumes:
      - openkb-milvus-minio-test-data:/data

  milvus:
    image: m.daocloud.io/docker.io/milvusdb/milvus:v2.6.10
    container_name: openkb-milvus-test
    command: ["milvus", "run", "standalone"]
    depends_on:
      - etcd
      - minio
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: openkb
      MINIO_SECRET_ACCESS_KEY: openkb-secret
      COMMON_STORAGETYPE: remote
    ports:
      - "59530:19530"
      - "59091:9091"
    volumes:
      - openkb-milvus-test-data:/var/lib/milvus

volumes:
  openkb-milvus-etcd-test-data:
  openkb-milvus-minio-test-data:
  openkb-milvus-test-data:
