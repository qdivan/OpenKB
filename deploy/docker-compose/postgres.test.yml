services:
  postgres:
    image: postgres:16-alpine
    container_name: openkb-postgres-test
    environment:
      POSTGRES_DB: openkb_test
      POSTGRES_USER: openkb
      POSTGRES_PASSWORD: openkb
    ports:
      - "${OPENKB_TEST_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openkb -d openkb_test"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - openkb-postgres-test-data:/var/lib/postgresql/data

volumes:
  openkb-postgres-test-data:
