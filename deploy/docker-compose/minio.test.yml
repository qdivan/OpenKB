services:
  minio:
    image: m.daocloud.io/docker.io/minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: openkb-minio-test
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: openkb
      MINIO_ROOT_PASSWORD: openkb-secret
    ports:
      - "${OPENKB_MINIO_TEST_PORT:-59000}:9000"
      - "${OPENKB_MINIO_TEST_CONSOLE_PORT:-59001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - openkb-minio-test-data:/data

volumes:
  openkb-minio-test-data:
