{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openkb.secretName" . }}
  labels:
    {{- include "openkb.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ include "openkb.databaseUrl" . | quote }}
  ADMIN_PASSWORD: {{ .Values.secrets.adminPassword | quote }}
  S3_ACCESS_KEY_ID: {{ .Values.secrets.s3AccessKeyId | quote }}
  S3_SECRET_ACCESS_KEY: {{ .Values.secrets.s3SecretAccessKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  MILVUS_TOKEN: {{ .Values.secrets.milvusToken | quote }}
  OPENKB_SMTP_PASSWORD: ""
  OPENKB_CONFIG_ENCRYPTION_KEY: ""
  MCP_OAUTH_SIGNING_SECRET: ""
  MILVUS_MINIO_ACCESS_KEY_ID: {{ .Values.secrets.milvusMinioAccessKeyId | quote }}
  MILVUS_MINIO_SECRET_ACCESS_KEY: {{ .Values.secrets.milvusMinioSecretAccessKey | quote }}
{{- end }}
