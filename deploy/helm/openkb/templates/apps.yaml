{{- if .Values.api.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openkb.fullname" . }}-api
  labels:
    {{- include "openkb.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      {{- include "openkb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "openkb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          image: {{ include "openkb.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-lc"]
          args: ["pnpm --filter @openkb/api start"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          env:
            - name: PORT
              value: {{ .Values.api.port | quote }}
            - name: UPLOAD_MAX_BYTES
              value: {{ .Values.api.uploadMaxBytes | quote }}
            {{ if .Values.milvus.tokenSecret }}
            - name: MILVUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.milvus.tokenSecret }}
                  key: {{ .Values.milvus.tokenKey }}
            {{ end }}
          envFrom:
            - configMapRef:
                name: {{ include "openkb.configName" . }}
            - secretRef:
                name: {{ include "openkb.secretName" . }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
{{- end }}
---
{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openkb.fullname" . }}-web
  labels:
    {{- include "openkb.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "openkb.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "openkb.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: {{ include "openkb.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["sh", "-lc"]
          args: ["pnpm --filter @openkb/web exec next start -p {{ .Values.web.port }} -H 0.0.0.0"]
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: PORT
              value: {{ .Values.web.port | quote }}
            {{ if .Values.milvus.tokenSecret }}
            - name: MILVUS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.milvus.tokenSecret }}
                  key: {{ .Values.milvus.tokenKey }}
            {{ end }}
          envFrom:
            - configMapRef:
                name: {{ include "openkb.configName" . }}
            - secretRef:
                name: {{ include "openkb.secretName" . }}
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
{{- end }}
