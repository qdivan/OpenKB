<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">OpenKB search preview</title>
  <desc id="desc">A clean preview of scoped knowledge base search in OpenKB.</desc>
  <rect width="1280" height="720" rx="28" fill="#F8FAFC"/>
  <rect x="118" y="72" width="1044" height="576" rx="26" fill="#FFFFFF" stroke="#E2E8F0"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="170" y="128" fill="#0F172A" font-size="28" font-weight="850">Search</text>
    <text x="170" y="158" fill="#64748B" font-size="15">Scoped to Product Docs</text>
    <rect x="170" y="200" width="760" height="58" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
    <circle cx="204" cy="229" r="10" stroke="#64748B" stroke-width="3"/>
    <path d="M212 237L224 249" stroke="#64748B" stroke-width="3" stroke-linecap="round"/>
    <text x="244" y="236" fill="#0F172A" font-size="18" font-weight="700">Phase 11 deployment checklist</text>
