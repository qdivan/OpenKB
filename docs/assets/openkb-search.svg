    <text x="487" y="481" fill="#0369A1" font-size="12" font-weight="800">0.92</text>
    <text x="252" y="508" fill="#475569" font-size="14">HTTPS, CORS, cookies, secrets, and reverse proxy checklist.</text>
    <text x="252" y="524" fill="#94A3B8" font-size="12">Deployment / Security / Public test</text>
