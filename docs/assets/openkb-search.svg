    <text x="170" y="306" fill="#475569" font-size="15">3 results</text>
    <rect x="170" y="330" width="940" height="90" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/>
    <rect x="198" y="358" width="34" height="34" rx="10" fill="#DBEAFE"/>
    <text x="252" y="368" fill="#0F172A" font-size="17" font-weight="850">Phase 11 Local Import Smoke</text>
    <rect x="506" y="350" width="58" height="24" rx="12" fill="#DCFCE7"/>
    <text x="522" y="367" fill="#166534" font-size="12" font-weight="800">1.36</text>
    <text x="252" y="394" fill="#475569" font-size="14">Import worker, Milvus rebuild, and retrieval search smoke notes.</text>
    <text x="252" y="410" fill="#94A3B8" font-size="12">Product Docs / Getting Started / Phase 11</text>
    <rect x="170" y="444" width="940" height="90" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
    <rect x="198" y="472" width="34" height="34" rx="10" fill="#CCFBF1"/>
    <text x="252" y="482" fill="#0F172A" font-size="17" font-weight="850">Public test deployment</text>
